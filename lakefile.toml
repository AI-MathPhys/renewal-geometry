name = "RenewalGeometry"
version = "0.2.0"
keywords = ["math", "noncommutative-geometry", "physics"]
defaultTargets = ["MathPhys", "RenewalGeometry"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc1"

# Generic mathematical physics and analysis (known theorems and infrastructure; depends on Mathlib only).
[[lean_lib]]
name = "MathPhys"

# The Renewal Geometry programme, built on MathPhys.
[[lean_lib]]
name = "RenewalGeometry"
