name = "NCG"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["NCG"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "QICLean"
git = "https://github.com/LionSR/QICLean.git"
rev = "v0.2.1"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc1"

[[lean_lib]]
name = "NCG"
